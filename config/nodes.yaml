# Worker machines for `studio run --node auto|<id>` (M3.5). Tokens are never written here: token_env names a
# variable in .env (same value on the controller and on the worker). A machine-local config/local.yaml may
# patch a node, e.g.  nodes: [{id: home-gpu, enabled: true, url: "http://100.101.102.103:8765"}]
nodes:
  - id: laptop
    role: controller
    url: null
    capabilities:
      gpu: null
      services: [ffmpeg_cpu, tts_cpu, whisper_cpu]

  - id: home-gpu
    role: worker
    enabled: false
    # Prefer the Tailscale address (100.x.y.z or machine name) - do NOT expose the worker publicly.
    url: http://home-gpu:8765
    token_env: STUDIO_NODE_HOME_GPU_TOKEN
    capabilities:
      gpu: rtx3080
      vram_gb: 10
      services: [ffmpeg_nvenc, tts_gpu, whisper_cuda, comfyui, blender]
    schedule:
      timezone: Asia/Ho_Chi_Minh
      windows: ["mon-fri 08:30-17:30"]
    policy:
      yield_if_user_active: true
      max_vram_gb: 9
