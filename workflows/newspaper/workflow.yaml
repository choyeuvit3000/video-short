# N1 - turn one news article into a short news video. The voice-over is planned idea by idea (hook, quote, fact,
# number, document, timeline, closing); each role gets a layout from assets/shared/layouts/news.yaml (headline,
# portrait_quote, editorial_photo, document / text card, stat_card, timeline, closing). Cost ~0.
name: newspaper
tier: N1
status: ready
description: News article (URL, saved page or pasted text) -> role-based news scenes (headline, portrait, photo, document, number, timeline) with 2-line captions.
cost: "~0 (subscription CLI summarizes the article, or none)"
formats: [short_9x16, long_16x9]
stages: [article, news_script, news_media, news_scenes, validate, voice, render, qc, package]
# AI only summarizes the article into beats; the first CLI that answers wins, "manual" = paste into a web chat.
llm_chain: [claude_cli, agy_cli, codex_cli, manual]
defaults:
  timing_mode: audio_driven
  ai_generated: true
  platforms: [tiktok, youtube_shorts, reels]
  video:
    caption_style: news_card    # the layout config's caption.style wins (set options.keep_caption_style to keep yours)
  audio: {speed: 1.25, trim_silence: true}  # +25% pace; VieNeu uses pitch-preserving atempo, content sets length
  options:
    rewrite: auto               # auto (AI if a CLI answers, else beats from the article text) | llm | none
    target_sec: null             # no duration cap; an optional value is only a pacing reference
    beats: null                  # one scene per coherent idea, as many as the content needs
    images: article             # article (download the article's photos, credited) | none (your images/ only)
    extra_images: commons       # commons (freely licensed illustrations for the beats' image_query) | none
    max_extra_images: 3
    image_queries: []           # extra Commons queries of your own (English works best)
    layout_config: asset:shared/layouts/news.yaml
    brand: ""                   # your channel name, shown top right and on the closing card (empty = none)
    accent: "#FF5A1F"           # brand colour (overrides the layout config's theme.accent)
    speech_cleanup: true
format_overrides:
  long_16x9:
    platforms: [youtube]
    video: {caption_style: clean_box}
    options: {keep_caption_style: true}
