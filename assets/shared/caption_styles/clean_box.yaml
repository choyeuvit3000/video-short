# Stable meaning-based phrases. Soft outline; no opaque box or word-by-word layout changes.
font: Arial
bold: true
uppercase: false
color: "#FFFFFF"
inactive_color: "#C8CDD2"
outline_color: "#16212B"
outline: 2.2
shadow: 1
shadow_color: "#000000"
shadow_alpha: 150
box: false
mode: karaoke
size_scale: 0.68
lines: 2
max_words: 9
max_chars: 40
line_chars: 22
smooth_phrases: true
fade_ms: 50
margin_v: 510
